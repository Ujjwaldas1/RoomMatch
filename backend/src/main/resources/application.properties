spring.application.name=Roomie
# Define the DataSource (DB Connection) URL
# Replace 'roommate_finder' with your database name if different
spring.datasource.url=jdbc:mysql://localhost:3306/roommate_finder

# Your MySQL username (usually 'root' for local development)
spring.datasource.username=root

# The password you set during MySQL installation
spring.datasource.password=1234

# Tell JPA to automatically create and update the database tables from your entities
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries that Hibernate executes (great for debugging, turn off in production)
spring.jpa.show-sql=true

# Use better SQL formatting so the logs are easier to read
spring.jpa.properties.hibernate.format_sql=true

# Dialect helps Hibernate generate optimized SQL for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
